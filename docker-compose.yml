services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: interview-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "4001:4001"
      - "4002:4002"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  stack:
    image: ghcr.io/cocorobotics/coco-interview-stack:latest
    container_name: interview-stack
    network_mode: "service:rabbitmq"
    environment:
      AMQP_URL: "amqp://guest:guest@localhost:5672/"
    depends_on:
      rabbitmq:
        condition: service_healthy

  dev:
    image: ghcr.io/cocorobotics/coco-interview-dev:latest
    container_name: interview-dev
    network_mode: "service:rabbitmq"
    working_dir: /work
    volumes:
      - .:/work
    command: ["sleep", "infinity"]
    depends_on:
      rabbitmq:
        condition: service_healthy
